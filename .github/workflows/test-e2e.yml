name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/**"
      - "frontend/**"
      - "backend/**"

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgrespass
          ALLOWED_HOSTS=backend,localhost,127.0.0.1
          EOF

      - name: Start services
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/schema/ && echo " backend ready" && break
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done

      - name: Wait for frontend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173/ && echo " frontend ready" && break
            echo "Waiting for frontend... ($i/20)"
            sleep 3
          done

      # Load prefecture master data — required for the E2E test user (pref is non-nullable)
      - name: Load fixtures
        run: |
          docker compose exec -T backend \
            python manage.py loaddata accounts/fixtures/prefectures.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
