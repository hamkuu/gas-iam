<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
<h1>My Profile</h1>

<table>
    <tr>
        <th>Username</th>
        <td>{{ user.username }}</td>
    </tr>
    <tr>
        <th>Email</th>
        <td>{{ user.email }}</td>
    </tr>
    <tr>
        <th>Phone</th>
        <td>{{ user.tel|default:"—" }}</td>
    </tr>
    <tr>
        <th>Prefecture</th>
        <td>{{ user.pref|default:"—" }}</td>
    </tr>
    <tr>
        <th>Date joined</th>
        <td>{{ user.date_joined }}</td>
    </tr>
    <tr>
        <th>Last login</th>
        <td>{{ user.last_login|default:"—" }}</td>
    </tr>
</table>

<form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
</body>
</html>
